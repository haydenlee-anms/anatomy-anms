<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>근골격계 뷰어 — 골반/고관절/요추</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    /* 손가락으로 돌릴 때 브라우저가 화면을 스크롤해버리는 것 방지 */
    canvas { display: block; touch-action: none; }

    #status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #888; font: 14px system-ui, sans-serif; text-align: center;
    }
    #credit {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 6px 10px; background: rgba(0,0,0,.6);
      color: #666; font: 10px/1.5 system-ui, sans-serif; text-align: center;
    }
    #credit a { color: #888; }
  </style>
</head>
<body>
  <div id="status">불러오는 중…</div>
  <!-- CC BY-SA 2.1 Japan 표기 의무. 지우지 말 것 -->

  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
