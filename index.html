<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>전신 근골격계 뷰어</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden;
                 font: 13px system-ui, -apple-system, sans-serif; color: #ccc; }
    canvas { display: block; touch-action: none; }   /* 손가락 회전 시 화면 스크롤 방지 */
    [hidden] { display: none !important; }           /* .row 의 display:flex 가 기본값을 이겨서 필요 */

    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
              color: #888; text-align: center; }

    #search { position: fixed; top: 8px; left: 8px; width: 240px; max-width: calc(100% - 16px);
              z-index: 2; }   /* 검색 결과가 아래 목록에 가리지 않게 */
    #q { width: 100%; height: 36px; padding: 0 10px; background: rgba(20,20,20,.9);
         color: #eee; border: 1px solid #444; border-radius: 4px; font-size: 14px; }
    #hits { margin-top: 4px; max-height: 40vh; overflow-y: auto;
            background: rgba(20,20,20,.95); border-radius: 4px; }
    #hits div { padding: 9px 10px; border-bottom: 1px solid #2a2a2a; }
    #hits div:last-child { border-bottom: 0; }
    #hits .sub { color: #777; font-size: 11px; }

    /* 구조를 하나씩 켜고 끄는 목록. 파묻힌 뼈는 화면에서 못 누르니까 여기서 누른다 */
    #list { position: fixed; top: 52px; left: 8px; width: 240px; max-width: calc(100% - 16px);
            max-height: 56vh; overflow-y: auto; background: rgba(20,20,20,.95);
            border: 1px solid #444; border-radius: 4px; }
    #list .head { position: sticky; top: 0; padding: 7px 10px; background: #1b1b1b;
                  border-bottom: 1px solid #333; color: #888; font-size: 11px; }
    #list .item { display: flex; align-items: center; gap: 8px; padding: 0 8px;
                  border-bottom: 1px solid #262626; }
    #list .item:last-child { border-bottom: 0; }
    #list .eye { width: 30px; height: 34px; flex: none; background: none; border: 0;
                 color: #6a9; font-size: 15px; }
    #list .item.off .eye { color: #555; }
    #list .item.off .nm { color: #666; text-decoration: line-through; }
    #list .nm { flex: 1; padding: 9px 0; color: #ddd; font-size: 12px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .item.sel { background: #3a2f14; }

    #info { position: fixed; top: 8px; right: 8px; width: 270px; max-width: calc(100% - 16px);
            max-height: 62vh; overflow-y: auto; padding: 12px;
            background: rgba(20,20,20,.95); border: 1px solid #444; border-radius: 4px; }
    #info h2 { font-size: 16px; color: #fff; margin-bottom: 2px; }
    #info .latin { color: #888; font-style: italic; font-size: 12px; margin-bottom: 8px; }
    #info dt { color: #c85; font-size: 11px; margin-top: 9px; }
    #info dd { color: #ddd; line-height: 1.5; }
    #info .warn { margin-top: 10px; padding: 7px 8px; background: #3a2a12;
                  border-left: 3px solid #c85; color: #d8b98a; font-size: 11px; line-height: 1.5; }
    /* 출처가 있는 자료. 경고가 아니라 안내라 초록으로 구분한다 */
    #info .warn.ok { background: #16301f; border-left-color: #4ad08a; color: #9ec9ae; }
    #info .src { color: #4ad08a; font-size: 10px; font-weight: normal; }
    #info .quote p { margin: 4px 0; padding-left: 8px; border-left: 2px solid #3c5c48;
                     color: #dcdcdc; line-height: 1.5; }
    #info .en { color: #bbb; line-height: 1.5; font-size: 12px; }
    #info details { margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
    #info summary { color: #c85; font-size: 11px; cursor: pointer; }
    #info details h3 { color: #8a8; font-size: 11px; margin-top: 9px; }
    #info details p { color: #b8b8b8; font-size: 12px; line-height: 1.5; margin-top: 2px; }
    #info .close { position: absolute; top: 8px; right: 10px; color: #888;
                   background: none; border: 0; font-size: 20px; }

    #panel { position: fixed; left: 0; right: 0; bottom: 22px;
             padding: 8px 12px; background: rgba(0,0,0,.75); }
    .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .row > label { width: 34px; flex: none; color: #999; font-size: 12px; }
    .row > output { width: 92px; flex: none; text-align: right; color: #eee; font-size: 12px; }
    input[type=range] { flex: 1; height: 30px; accent-color: #c85; }
    .btns { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
    .btns button, #flip { min-height: 32px; padding: 0 8px; background: #222; color: #aaa;
                          border: 1px solid #444; border-radius: 4px; font-size: 12px; }
    .btns button { flex: 1; min-width: 52px; }
    #flip { width: 58px; flex: none; }
    .btns button[aria-pressed=true] { background: #c85; color: #111; border-color: #c85; }
    .btns button.loading { background: #444; color: #888; }
    .btns button:disabled { color: #555; border-color: #2e2e2e; }

    #credit { position: fixed; bottom: 0; left: 0; right: 0; padding: 4px 10px;
              background: rgba(0,0,0,.85); color: #666; font-size: 10px; text-align: center; }
    #credit a { color: #888; }
  </style>
</head>
<body>
  <div id="status">불러오는 중…</div>

  <div id="search" hidden>
    <input id="q" type="search" placeholder="이름 검색 (한글·영어·라틴어)" autocomplete="off">
    <div id="hits" hidden></div>
  </div>

  <div id="list" hidden></div>

  <div id="info" hidden>
    <button class="close" id="infoClose" aria-label="닫기">×</button>
    <h2 id="iName"></h2>
    <div class="latin" id="iLatin"></div>
    <div class="btns" style="margin:8px 0">
      <button id="soloBtn">이것만 보기</button>
      <button id="peelBtn">벗겨내기</button>
    </div>
    <dl id="iBody"></dl>
  </div>

  <div id="panel" hidden>
    <div class="row">
      <label>부위</label>
      <div class="btns" id="regions">
        <button data-r="trunk">몸통</button>
        <button data-r="lower">하지</button>
        <button data-r="upper">상지</button>
        <button data-r="head">머리·목</button>
      </div>
    </div>
    <div class="row">
      <label>계통</label>
      <div class="btns" id="systems">
        <button data-s="뼈" aria-pressed="true">뼈</button>
        <button data-s="근육" aria-pressed="true">근육</button>
        <button data-s="관절·인대" aria-pressed="true">인대</button>
        <button data-s="신경">척수</button>
        <button data-s="부착부">부착부</button>
      </div>
    </div>
    <div class="row">
      <label for="layer">층</label>
      <input id="layer" type="range" min="0" max="3" step="1" value="3">
      <output id="layerOut"></output>
    </div>
    <div class="row">
      <label>목록</label>
      <div class="btns">
        <button id="listBtn">하나씩 켜고 끄기</button>
        <button id="undoPeel">마지막 하나 되돌리기</button>
        <button id="resetPeel">전부 되돌리기</button>
      </div>
      <output id="peelOut"></output>
    </div>
    <div class="row">
      <label>단면</label>
      <div class="btns" id="axes">
        <button data-axis="off" aria-pressed="true">끄기</button>
        <button data-axis="y">가로</button>
        <button data-axis="x">세로</button>
        <button data-axis="z">앞뒤</button>
      </div>
    </div>
    <div class="row" id="cutRow" hidden>
      <label for="cut">위치</label>
      <input id="cut" type="range" min="0" max="1000" step="1" value="500">
      <button id="flip">뒤집기</button>
      <output id="cutOut"></output>
    </div>
  </div>

  <!-- 출처 표기 의무. 지우지 말 것. -->
  <div id="credit">
    <a href="https://z-anatomy.com" target="_blank" rel="noopener">Z-Anatomy</a> —
    <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>
    &nbsp;·&nbsp; 원 자료 BodyParts3D, &copy; The Database Center for Life Science —
    <a href="https://creativecommons.org/licenses/by-sa/2.1/jp/" target="_blank" rel="noopener">CC BY-SA 2.1 Japan</a>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
